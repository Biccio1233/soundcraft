[package]
name = "wavecraft"
description = "WaveCraft: a single-file audio editor with restoration and music analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wavecraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
soundcraft-ui-wave.workspace = true
soundcraft-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
